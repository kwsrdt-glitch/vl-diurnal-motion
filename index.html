<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050914">
<title>지구의 자전과 겉보기 운동 가상 실험실</title>
<style>
:root{
  --ink:#050914;
  --glass:rgba(10,16,32,.72);
  --glass-solid:rgba(11,17,34,.95);
  --line:rgba(255,255,255,.14);
  --text:#f3f6fc;
  --sub:#9aa8c2;
  --acc:#ffc861;
  --cool:#7cc7ff;
  --ok:#5fd7a0;
  --bad:#ff8a8a;
  --r-pill:999px;
  --r-card:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--text);
  font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font-family:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0}
#gl,#chart{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#chart{display:none}

/* 상단: 탭 + 이론 확인 */
#top{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none}
#top>*{pointer-events:auto}
#nav{display:flex;gap:2px;padding:4px;border-radius:var(--r-pill);background:var(--glass);border:1px solid var(--line);overflow-x:auto;min-width:0;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
#nav button{flex:0 0 auto;height:40px;padding:0 15px;border:0;border-radius:var(--r-pill);background:transparent;
  color:var(--sub);font-size:14px;font-weight:600;white-space:nowrap;letter-spacing:-.01em;transition:background .2s,color .2s}
#nav button[aria-current=true]{background:#f3f6fc;color:#0a1020}
#topR{display:flex;gap:8px;flex:0 0 auto}
#fsBtn{width:48px;height:48px;border-radius:50%;background:var(--glass);border:1px solid var(--line);color:var(--text);display:flex;align-items:center;justify-content:center;padding:0}
#fsBtn svg{width:22px;height:22px}
#theoryBtn{flex:0 0 auto;display:flex;align-items:center;gap:7px;height:48px;padding:0 18px 0 14px;border-radius:var(--r-pill);
  background:var(--glass);border:1px solid var(--line);font-size:14px;font-weight:700}
#theoryBtn[aria-pressed=true]{background:var(--acc);color:#1b1405;border-color:var(--acc)}
#theoryBtn svg{width:20px;height:20px}

/* 하단: 장면 조작 + 시간 */
#ctrl{position:absolute;left:0;right:0;bottom:88px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px 10px;pointer-events:none;padding:0 12px}
#ctrl>*{pointer-events:auto}
.seg{display:flex;gap:2px;padding:4px;border-radius:var(--r-pill);background:var(--glass);border:1px solid var(--line)}
.seg button{min-width:56px;height:40px;padding:0 15px;border:0;border-radius:var(--r-pill);background:transparent;color:var(--sub);font-size:14px;font-weight:600;white-space:nowrap}
.seg button[aria-pressed=true]{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
.seg button.ico{display:flex;align-items:center;justify-content:center;min-width:44px;padding:0}
#timebar{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;width:min(720px,calc(100% - 24px));height:62px;
  display:flex;align-items:center;gap:12px;padding:0 12px 0 9px;border-radius:var(--r-pill);background:var(--glass);border:1px solid var(--line)}
#play{flex:0 0 46px;height:46px;border-radius:50%;border:0;background:#f3f6fc;color:#0a1020;display:flex;align-items:center;justify-content:center}
#sl{-webkit-appearance:none;appearance:none;flex:1;min-width:60px;height:44px;background:transparent;margin:0;--p:0%;--acc:#ffc861}
#sl::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--acc) var(--p),rgba(255,255,255,.22) var(--p))}
#sl::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-8px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 7px rgba(255,255,255,.16)}
#sl::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.22)}
#sl::-moz-range-progress{height:4px;border-radius:2px;background:var(--acc)}
#sl::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:0}
#ruler{flex:1;min-width:60px;height:46px;position:relative;touch-action:none;cursor:grab;display:none;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
#rulerC{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#ttext{flex:0 0 auto;min-width:92px;text-align:center;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#spd{flex:0 0 auto;height:40px;min-width:66px;padding:0 12px;border-radius:var(--r-pill);border:1px solid var(--line);background:transparent;font-size:13px;font-weight:600;color:var(--sub)}

/* 작은 지구 테두리 */
#inset{position:absolute;left:14px;top:70px;width:228px;height:228px;border-radius:50%;pointer-events:auto;touch-action:none;cursor:grab;display:none}
#miniReset{position:absolute;left:14px;top:256px;width:42px;height:42px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--text);display:none}
#miniReset svg{display:block;margin:auto}
#miniReset:active{background:rgba(255,255,255,.18)}

/* 확대·축소 */
#zoom{position:absolute;right:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px;padding:4px;border-radius:var(--r-pill);background:var(--glass);border:1px solid var(--line)}
#zoom button{width:46px;height:46px;border-radius:50%;border:0;background:transparent;font-size:26px;font-weight:500;line-height:1;color:var(--text)}
#zoom button:active{background:rgba(255,255,255,.16)}
/* 처음 한 번만 나타나는 힌트 */
#hint{position:absolute;left:50%;top:78px;transform:translateX(-50%);padding:8px 16px;border-radius:var(--r-pill);background:var(--glass);border:1px solid var(--line);
  font-size:13px;font-weight:600;color:var(--sub);pointer-events:none;opacity:0;transition:opacity .6s;white-space:nowrap}
#hint.show{opacity:1}

/* 이론 확인 서랍 */
#drawer{z-index:5;position:absolute;top:72px;right:12px;bottom:12px;width:min(368px,calc(100% - 24px));display:flex;flex-direction:column;
  background:var(--glass-solid);border:1px solid var(--line);border-radius:var(--r-card);
  transform:translateX(calc(100% + 24px));visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s}
#drawer.open{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s}
#dscroll{flex:1;overflow-y:auto;padding:20px 20px 24px;-webkit-overflow-scrolling:touch}
#drawer h3{font-size:19px;line-height:1.35;margin:0 0 14px;letter-spacing:-.02em}
.sec{font-size:12.5px;font-weight:700;color:var(--acc);margin:18px 0 8px}
#drawer p{font-size:15px;line-height:1.7;margin:0 0 10px;color:#dfe6f4}
#drawer b{color:var(--cool);font-weight:700}
#drawer ul{list-style:none;margin:0 0 8px;padding:0}
#drawer li{position:relative;font-size:15px;line-height:1.65;padding:0 0 9px 16px;color:#dfe6f4}
#drawer li::before{content:'';position:absolute;left:2px;top:.72em;width:5px;height:5px;border-radius:50%;background:var(--acc)}
.formula{margin:6px 0 12px;padding:14px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line);text-align:center;font-size:17px;font-weight:800;color:var(--acc);line-height:1.6}
.quiz p{font-weight:600;color:#fff}
.opt{display:block;width:100%;text-align:left;min-height:48px;margin:8px 0 0;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:14.5px;line-height:1.45}
.opt.ok{border-color:var(--ok);background:rgba(95,215,160,.14)}
.opt.no{border-color:var(--bad);background:rgba(255,138,138,.12)}
.fb{font-size:14px;line-height:1.6;margin-top:10px;color:var(--sub)}
.fb.good{color:#c4f1da}
.note{font-size:12px;color:var(--sub);margin-top:18px;line-height:1.5}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:16px;line-height:1.7}

@media (max-width:760px){
  #nav button{padding:0 11px;font-size:13px}
  #theoryBtn span{display:none}
  #theoryBtn{padding:0 14px}
  #spd{display:none}
}
</style>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>
  <canvas id="chart"></canvas>

  <div id="top">
    <nav id="nav">
      <button data-s="1">① 지구의 자전</button>
      <button data-s="2">② 겉보기 운동·일주 운동</button>
      <button data-s="3">③ 천구</button>
      <button data-s="5">④ 회전 각도</button>
      <button data-s="6">⑤ 위도에 따른 일주 운동</button>
    </nav>
    <div id="topR"><button id="fsBtn" aria-label="전체 화면"></button><button id="theoryBtn" aria-pressed="false"></button></div>
  </div>

  <div id="inset"></div>
  <button id="miniReset" aria-label="원위치" title="원위치"></button>
  <div id="hint"></div>
  <div id="ctrl"></div>
  <div id="zoom"><button data-z="in" aria-label="확대">+</button><button data-z="out" aria-label="축소">−</button></div>

  <div id="timebar">
    <button id="play" aria-label="재생 또는 정지"></button>
    <div id="ruler"><canvas id="rulerC"></canvas></div>
    <input id="sl" type="range" min="0" max="24" step="0.05" value="12" aria-label="시간">
    <div id="ttext"></div>
    <button id="spd" aria-label="재생 속도"></button>
  </div>

  <aside id="drawer" aria-label="이론 확인하기"><div id="dscroll"></div></aside>
  <div id="err">3D 화면을 시작하지 못했어요.<br>크롬 또는 삼성 인터넷 최신 버전으로 다시 열어 주세요.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>window.THREE||document.write('<script src="three.min.js"><\/script>')</script>
<script>
(function(){
'use strict';

/* ───────── 기본 값 ───────── */
const D=Math.PI/180, LAT=37*D, LON=127*D;          // 한국: 북위 37°, 동경 127°
const SKY=90;                                        // 관측자 하늘 반지름
const $=s=>document.querySelector(s);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const smooth=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x);};
const clock=t=>{t=((t%24)+24)%24;const h=Math.floor(t),m=Math.floor((t-h)*60);
  return (h<12?'오전 ':'오후 ')+(h%12===0?12:h%12)+':'+String(m).padStart(2,'0');};

const SP=[['느리게',0.25],['보통',0.5],['빠르게',1.5]];
const S={scene:1,t:12,playing:true,spi:1,mode3:'real',showSphere:true,dir:'S',view:'top',exposeStart:20,lat:37,showTrails:false};
const CFG={
  1:{min:0,max:24,step:0.05,fmt:t=>clock(t),def:12},
  2:{min:0,max:24,step:0.05,fmt:t=>clock(t),def:6},
  3:{min:0,max:24,step:0.05,fmt:t=>clock(t),def:12},
  4:{min:19,max:31,step:0.05,fmt:t=>clock(t),def:20},
  5:{min:0,max:12,step:1,fmt:t=>t+'시간',def:3},
  6:{min:0,max:24,step:0.05,fmt:t=>clock(t),def:12}
};
const ICON={
  play:'<svg viewBox="0 0 24 24" width="22" height="22"><path d="M8.5 5.4v13.2a1 1 0 0 0 1.5.86l10.6-6.6a1 1 0 0 0 0-1.72L10 4.54a1 1 0 0 0-1.5.86z" fill="currentColor"/></svg>',
  pause:'<svg viewBox="0 0 24 24" width="22" height="22"><rect x="6" y="5" width="4.2" height="14" rx="1.4" fill="currentColor"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4" fill="currentColor"/></svg>',
  reset:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4.5v4.8h4.8"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5 2.5 2.5 0 0 0 6.5 23H20"/></svg>',
  fsOn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
  fsOff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};

/* ───────── 전체 화면 ───────── */
const fsBtn=$('#fsBtn'),fsEl=document.documentElement;
const reqFS=fsEl.requestFullscreen||fsEl.webkitRequestFullscreen;
const exitFS=document.exitFullscreen||document.webkitExitFullscreen;
const isFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function renderFS(){fsBtn.innerHTML=isFS()?ICON.fsOff:ICON.fsOn;fsBtn.setAttribute('aria-label',isFS()?'전체 화면 끄기':'전체 화면');}
if(!reqFS)fsBtn.style.display='none';
fsBtn.addEventListener('click',()=>{
  if(isFS()){exitFS.call(document);}
  else{const r=reqFS.call(fsEl);if(r&&r.catch)r.catch(()=>{});}
});
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{renderFS();setTimeout(resize,150);}));
renderFS();

/* ───────── 렌더러 ───────── */
const glc=$('#gl');
let renderer;
try{ renderer=new THREE.WebGLRenderer({canvas:glc,antialias:true,powerPreference:'high-performance'}); }
catch(e){ $('#err').style.display='flex'; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
renderer.autoClear=false;
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(45,1.6,0.05,400);

scene.add(new THREE.AmbientLight(0xffffff,0.26));
const sunLight=new THREE.DirectionalLight(0xffffff,1.15); sunLight.position.set(10,0,0); scene.add(sunLight);

/* ───────── 텍스처 도우미 ───────── */
function label(text,h,color,fixed){
  const c=document.createElement('canvas'),g=c.getContext('2d'),fs=60;
  const font=`700 ${fs}px 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif`;
  g.font=font; const w=Math.ceil(g.measureText(text).width)+36; c.width=w; c.height=fs+32;
  g.font=font; g.textBaseline='middle'; g.lineJoin='round';
  g.lineWidth=11; g.strokeStyle='rgba(3,6,14,.78)'; g.strokeText(text,18,c.height/2+3);
  g.fillStyle=color||'#fff'; g.fillText(text,18,c.height/2+3);
  const tex=new THREE.CanvasTexture(c); tex.minFilter=THREE.LinearFilter;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false,sizeAttenuation:!fixed}));
  sp.scale.set(h*c.width/c.height,h,1); return sp;
}
function radialTex(stops){
  const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  const gr=g.createRadialGradient(128,128,0,128,128,128);stops.forEach(s=>gr.addColorStop(s[0],s[1]));
  g.fillStyle=gr;g.fillRect(0,0,256,256);return new THREE.CanvasTexture(c);
}
const dotTex=radialTex([[0,'rgba(255,255,255,1)'],[0.4,'rgba(255,255,255,.85)'],[1,'rgba(255,255,255,0)']]);
const sunTex=radialTex([[0,'rgba(255,255,255,1)'],[0.14,'rgba(255,250,210,1)'],[0.2,'rgba(255,220,110,.95)'],[0.3,'rgba(255,196,70,.5)'],[0.6,'rgba(255,165,40,.14)'],[1,'rgba(255,150,30,0)']]);
function moonTexture(){
  const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  const gr=g.createRadialGradient(128,128,70,128,128,128);gr.addColorStop(0,'rgba(215,228,255,.4)');gr.addColorStop(1,'rgba(215,228,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,256,256);
  g.beginPath();g.arc(128,128,72,0,7);g.fillStyle='#f1f3f9';g.fill();
  g.fillStyle='rgba(140,150,176,.32)';[[104,106,15],[150,120,19],[120,156,12],[156,162,9],[98,142,8],[132,92,7]].forEach(a=>{g.beginPath();g.arc(a[0],a[1],a[2],0,7);g.fill();});
  return new THREE.CanvasTexture(c);
}
function milkyTexture(){
  const W=1024,H=512,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  g.globalCompositeOperation='lighter';
  let s=77;const r=()=>(s=(s*16807)%2147483647)/2147483647;
  const gauss=()=>(r()+r()+r()+r()-2)*0.9;
  for(let i=0;i<2600;i++){
    const x=r()*W,y=H/2+gauss()*H*0.075,rad=8+r()*26,a=0.012+r()*0.035;
    const gr=g.createRadialGradient(x,y,0,x,y,rad);gr.addColorStop(0,`rgba(200,214,255,${a})`);gr.addColorStop(1,'rgba(200,214,255,0)');
    g.fillStyle=gr;g.fillRect(x-rad,y-rad,rad*2,rad*2);
  }
  for(let i=0;i<700;i++){
    const x=r()*W,y=H/2+gauss()*H*0.045,rad=4+r()*10,a=0.02+r()*0.04;
    const gr=g.createRadialGradient(x,y,0,x,y,rad);gr.addColorStop(0,`rgba(255,238,210,${a})`);gr.addColorStop(1,'rgba(255,238,210,0)');
    g.fillStyle=gr;g.fillRect(x-rad,y-rad,rad*2,rad*2);
  }
  return new THREE.CanvasTexture(c);
}

/* ───────── 지구 텍스처(간단한 대륙) ───────── */
function earthTexture(){
  const W=1024,H=512,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  const X=lo=>(lo+180)/360*W, Y=la=>(90-la)/180*H;
  const og=g.createLinearGradient(0,0,0,H);og.addColorStop(0,'#1d5ea8');og.addColorStop(0.5,'#2573bd');og.addColorStop(1,'#1d5ea8');
  g.fillStyle=og;g.fillRect(0,0,W,H);
  const poly=(pts,col)=>{g.beginPath();pts.forEach((p,i)=>i?g.lineTo(X(p[0]),Y(p[1])):g.moveTo(X(p[0]),Y(p[1])));g.closePath();g.fillStyle=col;g.fill();};
  const land='#5c9d5a', land2='#8cae68';
  poly([[-10,36],[-9,43],[-2,44],[-4,48],[4,52],[8,55],[10,58],[5,62],[15,69],[30,71],[60,69],[80,73],[110,77],[140,72],[170,70],[180,66],[165,60],[155,58],[140,55],[135,43],[130,42],[129,35],[126,35],[125,38],[125,40],[121,40],[122,32],[120,25],[110,20],[108,12],[105,9],[100,13],[103,2],[98,8],[98,16],[92,22],[88,22],[80,15],[77,8],[73,17],[67,25],[58,24],[56,26],[50,30],[48,30],[51,24],[56,17],[44,12],[43,16],[35,28],[34,31],[36,36],[28,36],[26,40],[23,37],[20,40],[19,42],[13,45],[16,41],[18,40],[12,42],[8,44],[3,43],[-1,37],[-5,36]],land);
  poly([[-17,21],[-10,30],[-5,36],[10,37],[32,31],[35,28],[43,12],[51,12],[40,-3],[40,-15],[35,-25],[20,-35],[18,-33],[12,-17],[9,-1],[9,4],[-8,4],[-17,14]],land2);

const ruler=$('#ruler'),rc=$('#rulerC'),PXH=22;
const ACC=(typeof getComputedStyle==='function'?getComputedStyle(document.documentElement).getPropertyValue('--acc').trim():'')||'#ffc861';
let rdrag=null;
ruler.addEventListener('pointerdown',e=>{ruler.setPointerCapture(e.pointerId);rdrag={x:e.clientX};S.playing=false;syncPlay();hideHint();});

function drawRuler(){
  const w=ruler.clientWidth,h=ruler.clientHeight;if(!w||!h)return;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  if(rc.width!==Math.round(w*dpr)||rc.height!==Math.round(h*dpr)){rc.width=Math.round(w*dpr);rc.height=Math.round(h*dpr);}
  const g=rc.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
  const cx=w/2,half=Math.ceil(cx/PXH)+1,k0=Math.floor(S.t)-half,k1=Math.floor(S.t)+half;
  g.textAlign='center';g.textBaseline='middle';g.font="600 11px 'Noto Sans KR',sans-serif";g.lineWidth=1;
  for(let k=k0;k<=k1;k++){
    const x=cx+(k-S.t)*PXH,hh=((k%24)+24)%24,major=(hh%6===0);
    g.strokeStyle=major?'rgba(255,255,255,.55)':'rgba(255,255,255,.22)';
    g.beginPath();g.moveTo(x,major?h*0.30:h*0.40);g.lineTo(x,h*0.62);g.stroke();
    if(major){g.fillStyle='rgba(200,215,245,.78)';g.fillText(String(hh),x,h*0.82);}
  }
  g.fillStyle=ACC;g.fillRect(cx-1,h*0.16,2,h*0.56);
  g.beginPath();g.arc(cx,h*0.16,3.5,0,7);g.fill();
}

/* ───────── 장면 ⑤ 각도 계산 그림 ───────── */
const DIPXY=[[14.0,24.2],[16.6,29.2],[24.3,26.5],[24.5,22.1],[28.7,18.2],[31.7,14.9],[38.5,13.2]];
const LINES=[[0,1],[1,2],[2,3],[3,0],[3,4],[4,5],[5,6]];
function drawChart(){
  const g=chart.getContext('2d'),w=chart._w,h=chart._h,dpr=chart._dpr;if(!w)return;
  g.setTransform(dpr,0,0,dpr,0,0);
  const bg=g.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#03060e');bg.addColorStop(1,'#0e1a3a');g.fillStyle=bg;g.fillRect(0,0,w,h);
  const hrs=Math.round(S.t), phi=hrs*15*D, cx=w/2, cy=h*0.5, s=Math.min(w*0.4,(h-210)/2)/50;
  const P=(x,y)=>[cx+x*s,cy-y*s];
  g.textBaseline='middle';g.lineCap='round';
  g.strokeStyle='rgba(160,185,255,.2)';g.lineWidth=1;g.setLineDash([3,7]);
  [15,30,45].forEach(r=>{g.beginPath();g.arc(cx,cy,r*s,0,7);g.stroke();});
  g.setLineDash([]);
  g.font="600 14px 'Noto Sans KR',sans-serif";g.fillStyle='rgba(200,215,245,.7)';
  g.textAlign='left';g.fillText('서',22,cy);g.textAlign='right';g.fillText('동',w-22,cy);
  const rot=(p,a)=>[p[0]*Math.cos(a)-p[1]*Math.sin(a),p[0]*Math.sin(a)+p[1]*Math.cos(a)];
  /* 별이 지나온 길 */
  g.strokeStyle='rgba(255,200,97,.35)';g.lineWidth=1.5;
  DIPXY.forEach(p=>{const r=Math.hypot(p[0],p[1]),a0=Math.atan2(p[1],p[0]);g.beginPath();g.arc(cx,cy,r*s,-a0,-(a0+phi),true);g.stroke();});
  const draw=(ang,col,dash,fill,lw)=>{
    const q=DIPXY.map(p=>P(...rot(p,ang)));g.strokeStyle=col;g.lineWidth=lw;g.setLineDash(dash);
    LINES.forEach(l=>{g.beginPath();g.moveTo(...q[l[0]]);g.lineTo(...q[l[1]]);g.stroke();});g.setLineDash([]);
    g.fillStyle=fill;q.forEach(p=>{g.beginPath();g.arc(p[0],p[1],5,0,7);g.fill();});
  };
  draw(0,'rgba(255,255,255,.35)',[5,6],'rgba(255,255,255,.5)',1.5);
  /* 각도 표시 (북극성 → 메라크) */
  const m=DIPXY[1],a0=Math.atan2(m[1],m[0]),L=52*s;
  g.strokeStyle='rgba(255,255,255,.55)';g.setLineDash([5,6]);g.lineWidth=1.5;g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+Math.cos(a0)*L,cy-Math.sin(a0)*L);g.stroke();g.setLineDash([]);
  if(hrs>0){
    g.strokeStyle='rgba(255,200,97,.9)';g.lineWidth=2;g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+Math.cos(a0+phi)*L,cy-Math.sin(a0+phi)*L);g.stroke();
    g.strokeStyle='#7cc7ff';g.lineWidth=3;g.beginPath();g.arc(cx,cy,22*s,-a0,-(a0+phi),true);g.stroke();
    const am=a0+phi/2;g.fillStyle='#7cc7ff';g.font="800 18px 'Noto Sans KR',sans-serif";g.textAlign='center';
    g.fillText(Math.round(hrs*15)+'°',cx+Math.cos(am)*30*s,cy-Math.sin(am)*30*s);
  }
  draw(phi,'#ffe9a8',[],'#fff3c8',2.2);
  /* 북극성 */
  g.fillStyle='#ffd37a';g.beginPath();g.arc(cx,cy,7,0,7);g.fill();
  g.font="600 13px 'Noto Sans KR',sans-serif";g.textAlign='left';g.fillStyle='#ffd37a';g.fillText('북극성',cx+12,cy+15);
  /* 식 */
  g.textAlign='center';g.font="800 24px 'Noto Sans KR',sans-serif";g.fillStyle='#ffc861';
  g.fillText('15° × '+hrs+'시간 = '+(hrs*15)+'°',cx,h-118);
}

const tmp=new THREE.Vector3(), sunW=new THREE.Vector3(), sunM=new THREE.Vector3();
const cNightZ=new THREE.Color('#040716'),cNightH=new THREE.Color('#0c1636'),cDayZ=new THREE.Color('#3b82d4'),cDayH=new THREE.Color('#a9d4f5'),cTw=new THREE.Color('#ff9d5c');

function update(dt){

  sunSprite.getWorldPosition(sunW);sunW.normalize();
  const U=domeMat.uniforms;
  if(n===1||n===3||n===6){
    setOrbitCam();U.zen.value.copy(spaceZ);U.hor.value.copy(spaceH);U.glowAmt.value=0;
    if(n===3)setStarOpacity(1);
    if(n===6)updateMini6(dt,t);
  }else{
    setObsCam(dt);
    {
      sunSprite.getWorldPosition(tmp);tmp.normalize();
      const sa=tmp.y, day=smooth(-0.1,0.15,sa), tw=Math.max(0,1-Math.abs(sa)/0.2)*0.8;
      U.zen.value.copy(cNightZ).lerp(cDayZ,day);
      U.hor.value.copy(cNightH).lerp(cDayH,day).lerp(cTw,tw*(1-day*0.4));
      U.sunDir.value.copy(tmp);U.glowAmt.value=smooth(-0.2,0.02,sa)*(0.55+0.45*tw);
      hillFar.material.color.copy(hfN).lerp(hfD,day);hillNear.material.color.copy(hnN).lerp(hnD,day);ground.material.color.copy(grN).lerp(grD,day);
      setStarOpacity(1-smooth(-0.2,0.05,sa));
      milky.material.opacity=0.6*(1-smooth(-0.2,0.05,sa));
      trailMat.uniforms.op.value=1-smooth(-0.2,0.05,sa);
      if(S.showTrails){if(n===2)updateTrails(90,t-3);else updateTrails(NTR,S.exposeStart);}
    }
  }
}

function renderGL(){
  const w=window.innerWidth,h=window.innerHeight;
  renderer.setScissorTest(false);renderer.setViewport(0,0,w,h);
  renderer.setClearColor(0x03060e,1);renderer.clear();
  renderer.getDrawingBufferSize(trailMat.uniforms.res.value);trailMat.uniforms.width.value=2.8*renderer.getPixelRatio();
  renderer.render(scene,cam);
  if(S.scene===2||S.scene===4){
    const iw=insetEl.offsetWidth,x=insetEl.offsetLeft,y=h-insetEl.offsetTop-iw;
    dome.visible=false;bgStars.visible=false;gObs.visible=false;skyPivot.visible=false;trails.visible=false;gSpace.visible=false;
    gMini.visible=true;
    setMiniLat(LAT);setMiniMode(false);
    const psi=-(S.t-12)*Math.PI/12;
    miniSkyRot.rotation.y=psi;viewMark.rotation.y=obs.yaw;viewMark.visible=true;
    sunM.set(Math.cos(psi),0,-Math.sin(psi)).applyQuaternion(miniPivot.quaternion);
    sunLight.position.copy(sunM).multiplyScalar(10);
    renderer.setScissorTest(true);renderer.setViewport(x,y,iw,iw);renderer.setScissor(x,y,iw,iw);
    renderer.clearDepth();renderer.render(scene,miniCam);renderer.setScissorTest(false);
    sunLight.position.set(10,0,0);
    configure();
  }
}

let last=performance.now();
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000);last=now;
  const c=CFG[S.scene];
  if(S.playing){
    S.t+=dt*SP[S.spi][1];
    if(S.scene===5){if(S.t>c.max){S.t=c.max;S.playing=false;syncPlay();}}
    else if(S.t>2400){S.t-=2400;S.exposeStart-=2400;}
  }
  if(S.scene!==5&&S.t<-2400){S.t+=2400;S.exposeStart+=2400;}
  if(S.scene===5){sl.value=S.t;sl.style.setProperty('--p',((S.t-c.min)/(c.max-c.min)*100).toFixed(1)+'%');}
  else drawRuler();
  ttext.textContent=c.fmt(S.scene===5?Math.round(S.t):S.t);
  if(S.scene===5){drawChart();}
  else{update(dt);miniEase(dt);renderGL();}
  requestAnimationFrame(frame);
}

/* 시작 */
syncSpd();renderTheoryBtn();
setScene(1);S.playing=true;syncPlay();
resize();
requestAnimationFrame(frame);
})();
</script>
